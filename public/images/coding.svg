<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="400" cy="400" r="320" fill="url(#bg)" opacity=".08"/>

  <!-- Floating React -->
  <g transform="translate(120 120)">
    <circle r="34" fill="#61DAFB"/>
    <text y="10" text-anchor="middle" font-size="20" font-family="Arial" fill="#fff">⚛</text>
  </g>

  <!-- Floating Next -->
  <g transform="translate(670 170)">
    <circle r="34" fill="#111827"/>
    <text y="10" text-anchor="middle" font-size="18" font-family="Arial" fill="#fff">N</text>
  </g>

  <!-- Head -->
  <circle cx="400" cy="210" r="65" fill="#FFD7B5"/>

  <!-- Hair -->
  <path
    d="M335 205
       C350 120 455 120 465 205
       L465 180
       C450 120 350 120 335 180 Z"
    fill="#1F2937"/>

  <!-- Body -->
  <rect
    x="330"
    y="270"
    width="140"
    height="150"
    rx="28"
    fill="#2563EB"/>

  <!-- Arms -->
  <rect
    x="260"
    y="300"
    width="80"
    height="24"
    rx="12"
    fill="#FFD7B5"/>

  <rect
    x="460"
    y="300"
    width="80"
    height="24"
    rx="12"
    fill="#FFD7B5"/>

  <!-- Laptop -->
  <rect
    x="220"
    y="330"
    width="360"
    height="210"
    rx="18"
    fill="url(#screen)"/>

  <!-- Code -->
  <rect x="250" y="365" width="150" height="10" rx="5" fill="#22c55e"/>
  <rect x="250" y="390" width="220" height="10" rx="5" fill="#3b82f6"/>
  <rect x="250" y="415" width="180" height="10" rx="5" fill="#f59e0b"/>
  <rect x="250" y="440" width="240" height="10" rx="5" fill="#ec4899"/>
  <rect x="250" y="465" width="140" height="10" rx="5" fill="#06b6d4"/>

  <!-- Keyboard -->
  <rect
    x="180"
    y="540"
    width="440"
    height="26"
    rx="13"
    fill="#6b7280"/>

  <!-- Desk -->
  <rect
    x="110"
    y="620"
    width="580"
    height="18"
    rx="9"
    fill="#374151"/>

  <!-- Coffee -->
  <g transform="translate(650 540)">
    <circle r="26" fill="#fff"/>
    <rect x="-10" y="-12" width="20" height="18" rx="3" fill="#92400e"/>
    <path d="M10 -10 h8 a8 8 0 0 1 0 16 h-8" stroke="#fff" stroke-width="3" fill="none"/>
  </g>

  <!-- Floating JS -->
  <rect x="120" y="540" width="70" height="70" rx="12" fill="#facc15"/>
  <text x="155" y="585" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold" fill="#111">
    JS
  </text>

</svg>